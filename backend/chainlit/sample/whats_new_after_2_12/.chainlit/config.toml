[project]
allow_origins = ["*"]

[features]
# Needed for the `latex` command.
latex = true

# New: configured directories survive shutdown (the legacy `.files` does not).
[features.spontaneous_file_upload]
enabled = true
directory = ".uploads"

# Opt-in only; set enabled = true with the `chainlit[otel]` extra installed.
[features.telemetry]
enabled = false

[UI]
name = "Chainlit NG 3.0 demo"
# New: local timestamps on user and assistant messages.
show_message_timestamps = true

[meta]
generated_by = "3.0.0"
